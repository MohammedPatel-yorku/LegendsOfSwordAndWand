<!DOCTYPE html>
<!-- With the use of AI -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Login — Legends of Sword and Wand</title>
        <link rel="stylesheet" th:href="@{/css/main.css}">
    </head>
    <body>
        <div class="page-wrapper">
            <div class="card">
                <div th:replace="~{fragments/card :: ornaments}"></div>

                <div class="card-header">
                    <span class="game-logo gold-pulse">⚔ Legends of Sword and Wand ⚔</span>
                    <p class="subtitle">Enter Your Credentials</p>
                </div>

                <div th:if="${param.error}" class="alert alert-error">
                    ✦ Invalid username or password. The shadows do not recognise you.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    ✦ You have left the realm safely.
                </div>

                <form method="POST" action="/login">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-input" type="text" id="username" name="username"
                               placeholder="Enter your name, adventurer..." autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" name="password"
                               placeholder="Speak the password..." autocomplete="current-password" required>
                    </div>

                    <button class="btn btn-primary btn-full" type="submit">
                        ⚔ &nbsp;Enter the Realm
                    </button>
                </form>

                <div class="card-footer">
                    No account yet? &nbsp;<a href="/register">Forge your legend →</a>
                </div>
            </div>
        </div>
    </body>
</html>
