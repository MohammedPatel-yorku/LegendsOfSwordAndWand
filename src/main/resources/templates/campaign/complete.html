<!DOCTYPE html>
<!-- With the use of AI -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campaign Complete — Legends of Sword and Wand</title>
        <link rel="stylesheet" th:href="@{/css/main.css}">
    </head>
    <body>
        <div class="page-wrapper">
            <div class="card wide">
                <div class="card-ornament tl"></div>
                <div class="card-ornament tr"></div>
                <div class="card-ornament bl"></div>
                <div class="card-ornament br"></div>

                <div th:replace="~{fragments/navbar :: userbar}"></div>

                <div class="card-header">
                    <span class="game-logo gold-pulse">✦ Campaign Complete ✦</span>
                    <p class="subtitle">30 Rooms Conquered</p>
                </div>

                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

                <!-- Final score -->
                <div style="text-align:center; margin: 1.5rem 0;">
                    <div class="stat-value" style="font-size:3rem;" th:text="${score}">0</div>
                    <div class="stat-label">Final Score</div>
                </div>

                <div class="divider">Your Party</div>

                <!-- Hero summary -->
                <div class="party-panel" style="margin-bottom:1.5rem;">
                    <div th:each="hero : ${heroes}" class="hero-card">
                        <div class="hero-card-top">
                            <span class="hero-name" th:text="${hero.name}">Hero</span>
                            <span th:if="${hero.hybrid}"
                                  class="hero-class-badge HYBRID"
                                  th:text="${hero.hybridClass}">Hybrid</span>
                            <span th:unless="${hero.hybrid}"
                                  th:class="'hero-class-badge ' + ${hero.startingClass}"
                                  th:text="${hero.startingClass}">Class</span>
                        </div>
                        <div class="hero-level">
                            Lv <span th:text="${hero.level}">1</span>
                            &nbsp;·&nbsp;
                            <span th:text="${hero.attack}">5</span> ATK
                            &nbsp;·&nbsp;
                            <span th:text="${hero.defense}">5</span> DEF
                        </div>
                    </div>
                </div>

                <div class="divider">Save Your Party?</div>
                <p style="text-align:center; color:var(--text-secondary); font-size:0.9rem; margin-bottom:1.2rem;">
                    Save this party to use in PvP battles. You can store up to 5 parties.
                </p>

                <!-- Save — slots available -->
                <div th:if="${!partyFull}">
                    <form th:action="@{/campaign/complete/save}" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        <input type="hidden" name="campaignId" th:value="${campaignId}"/>
                        <button type="submit" class="btn btn-primary btn-full" style="margin-bottom:0.8rem;">
                            ✦ &nbsp; Save Party to Profile
                        </button>
                    </form>
                </div>

                <!-- Replace — slots full -->
                <div th:if="${partyFull}">
                    <p style="color:var(--gold-bright); font-family:'Cinzel',serif; font-size:0.8rem;
                              text-align:center; margin-bottom:0.8rem;">
                        Your profile is full. Choose a party to replace:
                    </p>
                    <div th:each="saved : ${savedParties}" style="margin-bottom:0.5rem;">
                        <form th:action="@{/campaign/complete/replace}" method="post">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                            <input type="hidden" name="campaignId" th:value="${campaignId}"/>
                            <input type="hidden" name="replacePartyId" th:value="${saved.id}"/>
                            <button type="submit" class="btn btn-danger btn-full">
                                Replace party (Lv <span th:text="${saved.cumulativeLevel}">0</span> total,
                                <span th:text="${saved.gold}">0</span>g)
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Discard -->
                <form th:action="@{/campaign/complete/discard}" method="post" style="margin-top:0.5rem;">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-ghost btn-full" style="font-size:0.75rem;">
                        Discard Party &amp; Return to Dashboard
                    </button>
                </form>

            </div>
        </div>
    </body>
</html>
